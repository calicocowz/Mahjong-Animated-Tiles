<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lines Tiles Showcase</title>
<meta name="description" content="An auto-playing showcase of the five Lines tile sets.">
<style>
  :root {
    --ground: #0b0c0e;
    --rule: #31353a;
    --mute: #8c8c8c;
    --soft: #d6d6d6;
    --ink: #f4f4f4;
    --dark: #16181b;
    --pink: #ff5fd2;
    --pad: clamp(16px, 3vw, 40px);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink); overflow: hidden;
    font: 14px/1.5 ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; }
  .stage { position: fixed; inset: 0; display: flex; flex-direction: column; gap: clamp(10px, 2.2vh, 24px); padding: var(--pad); }

  header { display: flex; align-items: center; gap: 16px; }
  .brand { font-weight: 800; letter-spacing: .1em; font-size: clamp(14px, 1.8vw, 22px); white-space: nowrap; }
  .road { position: relative; flex: 1; height: 14px; background: var(--ink); overflow: hidden; }
  .car { position: absolute; top: 2px; left: -12px; width: 10px; height: 10px; background: var(--ground);
    box-shadow: 0 0 0 2px var(--ink), 0 0 0 3.5px #585858; animation: drive var(--dur) linear both; }
  @keyframes drive { from { left: -12px; } to { left: 100%; } }

  .title h1 { margin: 0; font-size: clamp(34px, 7.5vw, 104px); line-height: .95; letter-spacing: .06em; font-weight: 800; }
  .title p { margin: 8px 0 0; color: var(--soft); max-width: 62ch; font-size: clamp(13px, 1.4vw, 18px); }
  .title.in { animation: titleIn .6s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes titleIn { from { transform: translateX(-40px); opacity: 0; } to { transform: none; opacity: 1; } }

  .handrow { position: relative; display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap; }
  .hand { display: flex; align-items: flex-end; gap: 4px; }
  .hand .gap { width: 14px; }
  .stamp {
    display: inline-block; background: var(--ink); color: var(--dark); border: 3px solid var(--dark); outline: 2px solid var(--ink);
    font-weight: 800; letter-spacing: .14em; font-size: clamp(14px, 1.8vw, 24px); padding: 4px 12px; transform: rotate(-4deg);
    animation: stamp .35s cubic-bezier(.2, .9, .3, 1.3) var(--sd, 2.3s) both;
  }
  @keyframes stamp { from { transform: scale(1.9) rotate(-10deg); opacity: 0; } to { transform: rotate(-4deg); opacity: 1; } }

  .grid { display: flex; flex-direction: column; gap: 6px; }
  .grid .row { display: flex; gap: 5px; align-items: flex-end; }

  .t { display: inline-block; line-height: 0; animation: drop .55s cubic-bezier(.2, .9, .25, 1.15) var(--d) both; }
  .t.drawn { animation-name: slide; }
  .t.g { animation-name: rise; animation-duration: .45s; animation-timing-function: ease-out; }
  @keyframes drop { from { transform: translateY(-48px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes slide { from { transform: translateX(70px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }

  footer { margin-top: auto; display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 2px solid var(--ink); }
  .seg button, .ctl {
    font: inherit; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; cursor: pointer;
    background: transparent; color: var(--ink); border: 0; padding: 6px 12px;
  }
  .seg button + button { border-left: 2px solid var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--dark); }
  .ctl { border: 2px solid var(--ink); }
  button:focus-visible { outline: 2px dashed var(--pink); outline-offset: 3px; }
  .hint { color: var(--mute); font-size: 12px; }

  /* a redraw for a new window size shows the scene at once, without replaying the entrance */
  .settled .t, .settled .stamp, .settled .title { animation: none !important; }
  .paused .car, .paused .t, .paused .stamp, .paused .title { animation-play-state: paused !important; }
  @media (prefers-reduced-motion: reduce) {
    .t, .stamp, .title.in { animation: none !important; }
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <header>
    <div class="brand">LINES TILES</div>
    <div class="road" aria-hidden="true" id="road"></div>
  </header>
  <div class="title" id="title"><h1 id="name"></h1><p id="line"></p></div>
  <div class="handrow"><div class="hand" id="hand" role="img"></div><span class="stamp" id="stamp">TSUMO</span></div>
  <div class="grid" id="grid"></div>
  <footer>
    <div class="seg" id="sets" aria-label="Tile sets"></div>
    <button type="button" class="ctl" id="play">Pause</button>
    <button type="button" class="ctl" id="full">Full screen</button>
    <span class="hint">&larr; &rarr; change set &middot; Space pause &middot; F full screen</span>
  </footer>
</div>

<script src="lines-tiles.js"></script>
<script>
(function () {
  "use strict";
  var L = window.LinesTiles;
  var DURATION = 10000;                              // one set, ms
  // every hand here is complete: four sets and a pair, won on the separated tile
  var SCENES = [
    { set: "road", name: "Road", line: "The race on a tile. Every coin is the car, and one light laps the rim.", hand: "123m406p789s11z55z 5z" },
    { set: "sheet", name: "Sheet", line: "The Lines editor in ink. The lines boil like hand-drawn animation.", hand: "11m234p567s789s66z 6z" },
    { set: "garden", name: "Garden", line: "A flower bed for every number. Where nature allows, the petals count the tile.", hand: "123456789p99p78s 9s" },
    { set: "flair", name: "Flair", line: "Neon on a dark tile, crisp marks over a soft glow, and a slow sheen.", hand: "22345m345p345s77z 7z" },
    { set: "block", name: "Block", line: "The 3D view. Every mark a softly extruded block that drifts with the camera.", hand: "123m123p123s567s4z 4z" }
  ].filter(function (s) { return L.sets.indexOf(s.set) >= 0; });
  var ROWS = [
    ["1m", "2m", "3m", "4m", "5m", "6m", "7m", "8m", "9m", "0m"],
    ["1p", "2p", "3p", "4p", "5p", "6p", "7p", "8p", "9p", "0p"],
    ["1s", "2s", "3s", "4s", "5s", "6s", "7s", "8s", "9s", "0s"],
    ["1z", "2z", "3z", "4z", "5z", "6z", "7z", "back"]
  ];
  function $(id) { return document.getElementById(id); }
  var stage = $("stage"), current = 0, paused = false, timer = null, started = 0, remaining = DURATION;

  // the set buttons
  SCENES.forEach(function (s, i) {
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = s.name;
    b.addEventListener("click", function () { go(i); });
    $("sets").appendChild(b);
  });

  // tile sizes from the space actually free on this screen
  function sizes() {
    var W = stage.clientWidth - 2 * parseFloat(getComputedStyle(stage).paddingLeft);
    // 14 tiles + 14 gaps of 4 px + the 14 px gap before the drawn tile + 18 px + the stamp (~150 px) on one line
    var hand = Math.max(20, Math.min(72, Math.floor((W - 56 - 14 - 18 - 150) / 14)));
    if (W < 640) hand = Math.max(18, Math.floor((W - 13 * 4 - 14) / 14));     // narrow: the stamp wraps below
    var used = $("title").offsetHeight + document.querySelector("header").offsetHeight +
      document.querySelector("footer").offsetHeight + hand * 86 / 60 + 4 * 24 + 2 * parseFloat(getComputedStyle(stage).paddingTop);
    var leftH = window.innerHeight - used;
    var grid = Math.floor(Math.min((W - 9 * 5) / 10, (leftH - 3 * 6) / 4 * 60 / 86, 58));
    return { hand: hand, grid: Math.max(14, grid) };
  }

  function render(i, animate) {
    var sc = SCENES[i];
    current = i;
    stage.classList.toggle("settled", !animate);
    $("name").textContent = sc.name.toUpperCase();
    $("line").textContent = sc.line;
    var title = $("title");
    title.classList.remove("in");
    void title.offsetWidth;                       // restart the entrance
    if (animate) title.classList.add("in");
    var sz = sizes();

    var codes = L.parseHand(sc.hand), html = "", k = 0;
    codes.forEach(function (c) {
      if (c === null) { html += '<span class="gap"></span>'; return; }
      var drawn = k === 13;
      html += '<span class="t' + (drawn ? " drawn" : "") + '" style="--d:' + (drawn ? 1600 : 250 + k * 75) + 'ms">' +
        L.svg(sc.set, c, { size: sz.hand }) + "</span>";
      k++;
    });
    $("hand").innerHTML = html;
    $("hand").setAttribute("aria-label", sc.name + " hand: " + codes.filter(Boolean).map(L.label).join(", ") + ". Tsumo.");
    var stamp = $("stamp"), fresh = stamp.cloneNode(true);
    stamp.parentNode.replaceChild(fresh, stamp);  // a new element replays the stamp

    var n = 0;
    $("grid").innerHTML = ROWS.map(function (row) {
      return '<div class="row">' + row.map(function (c) {
        return '<span class="t g" style="--d:' + (2500 + (n++) * 22) + 'ms">' + L.svg(sc.set, c, { size: sz.grid }) + "</span>";
      }).join("") + "</div>";
    }).join("");

    $("sets").querySelectorAll("button").forEach(function (b, j) { b.setAttribute("aria-pressed", String(j === i)); });
    if (animate) {
      $("road").innerHTML = '<div class="car" style="--dur:' + DURATION + 'ms"></div>';
      schedule(DURATION);
    }
  }

  function schedule(ms) {
    clearTimeout(timer);
    remaining = ms;
    started = performance.now();
    if (!paused) timer = setTimeout(function () { go(current + 1); }, ms);
  }
  function go(i) { render((i + SCENES.length) % SCENES.length, true); }
  function setPaused(p) {
    if (p === paused) return;
    paused = p;
    stage.classList.toggle("paused", p);
    $("play").textContent = p ? "Play" : "Pause";
    if (p) { clearTimeout(timer); remaining -= performance.now() - started; }
    else schedule(Math.max(0, remaining));
  }
  function fullscreen() {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    } catch (e) { /* not allowed here: the page still works */ }
  }

  $("play").addEventListener("click", function () { setPaused(!paused); });
  $("full").addEventListener("click", fullscreen);
  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "BUTTON" && (e.key === " " || e.key === "Enter")) return;   // let buttons work
    if (e.key === "ArrowRight") go(current + 1);
    else if (e.key === "ArrowLeft") go(current - 1);
    else if (e.key === " ") { e.preventDefault(); setPaused(!paused); }
    else if (e.key === "f" || e.key === "F") fullscreen();
  });
  var resizeTimer = null, lastW = window.innerWidth, lastH = window.innerHeight;
  window.addEventListener("resize", function () {
    if (window.innerWidth === lastW && window.innerHeight === lastH) return;
    lastW = window.innerWidth;
    lastH = window.innerHeight;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { render(current, false); }, 150);   // redraw in place; the clock keeps running
  });

  var start = SCENES.map(function (s) { return s.set; }).indexOf(new URLSearchParams(location.search).get("set"));
  go(start >= 0 ? start : 0);
})();
</script>
</body>
</html>
